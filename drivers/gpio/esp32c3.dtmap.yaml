compatible: esp,esp32c3-gpio
config: GPIO_ESP32C3
class: [gpio, intc]
define: PBL_GPIO_ESP32C3_DEFINE
symbol:
  gpio: "{sym}"
  intc: "{sym}_intc"
args:
  - name: true
  - reg: 0
  - irq: 0
  - prop: ngpios
  - reg: 0
    of: esp,io-mux
