# adc-keys is polled, adc-keys-irq read on its interrupt
compatible: [adc-keys-irq, adc-keys]
config: INPUT_ADC_KEYS
class: input
define: PBL_ADC_KEYS_DEFINE
args:
  - name: true
  - io-channel: buttons
  - prop: keyup-threshold-microvolt
  - irq: 0
    default: "{}"
  - pinctrl: default
    default: nullptr
  - prop: poll-interval
    default: 0
  - list: []
    item:
      define: PBL_ADC_KEYS_KEY
      args:
        - string: label
          default: '""'
        - prop: linux,code
        - prop: press-threshold-microvolt
