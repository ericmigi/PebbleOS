compatible: ti,tca8418
config: INPUT_TCA8418
class: input
define: PBL_TCA8418_DEFINE
args:
  - name: true
  - parent: i2c
  - reg: 0
  - irq: 0
  - irq: 0
    as: irq-gpio
  - prop: keypad,num-rows
  - prop: keypad,num-columns
  - prop: linux,keymap
    item: "{0:#010x}"
