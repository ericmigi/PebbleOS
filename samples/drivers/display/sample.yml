description: Colour bars drawn on the whole display, then a checkerboard updated in the background over its lower third
expect:
  - 'display: \d+x\d+, (mono|argb2222|rgb565)'
  - 'display: bars shown'
  - 'display: checkerboard shown'
  - 'Sample done'
roles: [display]
integration: [qemu_emery, qemu_flint, asterix, obelix@pvt, qemu_esp32c3, qemu_esp32s3, xteink_x4]
# Flashing included: an e-paper panel takes seconds per update
timeout: 30
