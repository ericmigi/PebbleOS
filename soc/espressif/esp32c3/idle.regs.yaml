# Blocks and pins the light sleep idle state touches with interrupts masked
config: SOC_ESP32C3_LIGHT_SLEEP
labels:
  - efuse
  - gpio
  - rtc_cntl
  - timg0
props:
  - label: power_latch
    prop: gpios
    cell: 1
  - label: charger
    prop: gpios
    cell: 1
