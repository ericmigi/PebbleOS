CONFIG_GPIO=y
CONFIG_SF32LB_JDI=y
CONFIG_WATCHDOG=y

# NimBLE host and the SF32 LCPU controller transport.
CONFIG_USE_SIFLI_HAL=y
CONFIG_USE_SIFLI_HAL_AON=y
CONFIG_USE_SIFLI_HAL_LCPU_PATCH=y
CONFIG_USE_SIFLI_HAL_MAILBOX=y
CONFIG_USE_SIFLI_HAL_SYSTEM_CONFIG=y

# HCPU/LCPU HCI rings live in shared SRAM. The port does not yet install the
# shipping non-cacheable MPU region, so keep the HCPU D-cache disabled to make
# controller IPC coherent.
CONFIG_DCACHE=n
