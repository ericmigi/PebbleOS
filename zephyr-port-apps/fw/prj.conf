CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=y
CONFIG_CRC=y
CONFIG_DISPLAY=y
CONFIG_SF32LB_JDI=y
CONFIG_FLASH=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_MINIMAL_LIBC_RAND=y
CONFIG_NUM_PREEMPT_PRIORITIES=12
CONFIG_PRINTK=y
CONFIG_RTC=y
CONFIG_SERIAL=y
CONFIG_THREAD_NAME=y
CONFIG_UART_CONSOLE=y

# PebbleOS emits concise bring-up markers directly on UART.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Keep firmware threads privileged. The custom hooks only alter the app map
# after fw_sandbox_launch() has prepared and armed the sandbox.
CONFIG_ARM_MPU=y
CONFIG_ARM_CUSTOM_SVC_HOOK=y
CONFIG_ARM_CUSTOM_THREAD_RESTORE_HOOK=y
CONFIG_USERSPACE=n
