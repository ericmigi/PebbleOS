CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=y
CONFIG_CRC=y
CONFIG_DISPLAY=y
CONFIG_FLASH=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_MINIMAL_LIBC_RAND=y
# NimBLE's GATT server registers services via libc realloc/malloc
# (ble_gatts_add_svcs). Without a real malloc arena those return NULL and
# ble_svc_gap_init panics. Match the standalone ble app's allocator.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
CONFIG_NUM_PREEMPT_PRIORITIES=12
CONFIG_PRINTK=y
CONFIG_RTC=y
CONFIG_REBOOT=y
CONFIG_SERIAL=y
CONFIG_THREAD_NAME=y
CONFIG_UART_CONSOLE=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# PebbleOS emits concise bring-up markers directly on UART.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Keep firmware threads privileged. The custom hooks only alter the app map
# after fw_sandbox_launch() has prepared and armed the sandbox.
CONFIG_ARM_MPU=y
CONFIG_ARM_CUSTOM_SVC_HOOK=y
CONFIG_ARM_CUSTOM_THREAD_RESTORE_HOOK=y
CONFIG_USERSPACE=n
