CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_RTC=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# The legacy PBW is copied into writable SRAM and executed there.  This first
# privileged integration intentionally does not claim the S4 userspace sandbox.
CONFIG_ARM_MPU=n
