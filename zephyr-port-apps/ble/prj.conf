CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_THREAD_NAME=y
CONFIG_UART_CONSOLE=y

CONFIG_USE_SIFLI_HAL=y
CONFIG_USE_SIFLI_HAL_AON=y
CONFIG_USE_SIFLI_HAL_LCPU_PATCH=y
CONFIG_USE_SIFLI_HAL_MAILBOX=y
CONFIG_USE_SIFLI_HAL_SYSTEM_CONFIG=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# The BLE controller (LCPU) and HCPU share RAM: the LCPU boot data (patch,
# config, NVDS) in LPSYS RAM at 0x2040_0000 and the HCI command/event rings in
# HPSYS RAM. The shipping firmware runs the SiFli mpu_config() which marks that
# RAM non-cacheable; this standalone Zephyr port never does, so with the HCPU
# D-cache on, writes to the shared rings sat in cache and the LCPU read stale
# RAM (never booted / never drained HCI). Disable the D-cache to guarantee
# HCPU<->LCPU coherency.
# ponytail: global D-cache off; upgrade to a non-cacheable MPU region covering
# just 0x2040_0000 + the HPSYS mailbox if HCPU throughput matters.
CONFIG_DCACHE=n
