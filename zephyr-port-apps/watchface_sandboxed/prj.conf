CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=y
CONFIG_DISPLAY=y
CONFIG_SF32LB_JDI=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PRINTK=y
CONFIG_RTC=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# The PBW runs in an app-owned RWX MPU region. Firmware SRAM remains
# privileged-only; the custom hooks switch the app map and service svc #4.
CONFIG_ARM_MPU=y
CONFIG_ARM_CUSTOM_SVC_HOOK=y
CONFIG_ARM_CUSTOM_THREAD_RESTORE_HOOK=y
CONFIG_USERSPACE=n
CONFIG_LOG_MODE_IMMEDIATE=y
