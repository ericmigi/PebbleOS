%YAML 1.2
---
$id: http://devicetree.org/schemas/display/qemu,esp-rgb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QEMU ESP RGB display

maintainers:
  - Eric Migicovsky <eric@repebble.com>

description:
  Virtual RGB framebuffer of Espressif's QEMU machines (display.esp.rgb), a
  window of up to 800x600 pixels shown from its video memory. The firmware
  emulates the panel described here in that window, as the panel's controller
  scans it, with the framebuffer scaled up and centred on the panel.

properties:
  compatible:
    const: qemu,esp-rgb

  reg:
    items:
      - description: Registers
      - description: Video memory

  reg-names:
    items:
      - const: regs
      - const: vram

  width:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Framebuffer width, in pixels.

  height:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Framebuffer height, in pixels.

  panel-width:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Panel width as mounted, in pixels.

  panel-height:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Panel height as mounted, in pixels.

  scale:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Panel pixels per framebuffer pixel, in each direction.
    minimum: 1
    default: 1

  bits-per-pixel:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: 1 for monochrome, white set, or 16 for RGB565.
    enum: [1, 16]

  rotation:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Mounting rotation of the panel, counter-clockwise, in degrees. At 90 or
      270 the window is panel-height wide and panel-width tall.
    enum: [0, 90, 180, 270]
    default: 0

required:
  - compatible
  - reg
  - reg-names
  - width
  - height
  - panel-width
  - panel-height
  - bits-per-pixel

additionalProperties: false

examples:
  - |
    display@21000000 {
        compatible = "qemu,esp-rgb";
        reg = <0x21000000 0x1c>, <0x20000000 0x1d4c00>;
        reg-names = "regs", "vram";
        width = <480>;
        height = <800>;
        panel-width = <480>;
        panel-height = <800>;
        bits-per-pixel = <1>;
        rotation = <90>;
    };
