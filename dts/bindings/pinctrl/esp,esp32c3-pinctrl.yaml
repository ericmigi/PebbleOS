%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/esp,esp32c3-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-C3 pin controller (IO_MUX and GPIO matrix)

maintainers:
  - Eric Migicovsky <eric@repebble.com>

description: |
  Configures the pads of the ESP32-C3 and routes peripheral signals to them
  through the GPIO matrix. A pinmux cell, ESP32C3_PINMUX(pad, in, out) of
  <dt-bindings/pinctrl/esp32c3-pinctrl.h>, gives a pad and the numbers of the
  matrix's input signal reading it and output signal driving it, or
  ESP32C3_NOSIG. Pin configuration states are children of the controller,
  holding groups of pins that share a pad configuration.

properties:
  compatible:
    const: esp,esp32c3-pinctrl

  reg:
    maxItems: 1

  esp,gpio-matrix:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: GPIO matrix, which routes the signals.

patternProperties:
  '-state$':
    type: object
    description: A pin configuration state, referenced from pinctrl-N.

    patternProperties:
      '^(.+-)?pins$':
        type: object
        description: A group of pins sharing their pad configuration.
        allOf:
          - $ref: /schemas/pinctrl/pincfg-node.yaml#

        properties:
          pinmux:
            $ref: /schemas/types.yaml#/definitions/uint32-array

          bias-disable: true
          bias-pull-up: true
          bias-pull-down: true
          drive-push-pull: true
          drive-open-drain: true

          drive-strength:
            enum: [5, 10, 20, 40]

        required:
          - pinmux

        additionalProperties: false

    additionalProperties: false

required:
  - compatible
  - reg
  - esp,gpio-matrix

additionalProperties: false

examples:
  - |
    pinctrl@60009000 {
        compatible = "esp,esp32c3-pinctrl";
        reg = <0x60009000 0x1000>;
        esp,gpio-matrix = <&gpio>;

        spi2-default-state {
            sck-pins {
                pinmux = <((8) | (0x1ff << 6) | (63 << 15))>;
                drive-strength = <20>;
            };
        };
    };
