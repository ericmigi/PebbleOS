%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/esp,esp32c3-timg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-C3 timer group

maintainers:
  - Eric Migicovsky <eric@repebble.com>

description:
  A general-purpose 54-bit timer and a watchdog, which the boot ROM may
  leave armed.

properties:
  compatible:
    const: esp,esp32c3-timg

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: Timer
      - description: Watchdog

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    timer@6001f000 {
        compatible = "esp,esp32c3-timg";
        reg = <0x6001f000 0x1000>;
        interrupts = <32>, <33>;
    };
