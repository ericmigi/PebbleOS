%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/espressif/esp,esp32c3-system.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-C3 system registers

maintainers:
  - Eric Migicovsky <eric@repebble.com>

description:
  Clock, reset and peripheral enables of the ESP32-C3, and the four
  interrupts the CPU raises in software.

properties:
  compatible:
    const: esp,esp32c3-system

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@600c0000 {
        compatible = "esp,esp32c3-system";
        reg = <0x600c0000 0x1000>;
    };
