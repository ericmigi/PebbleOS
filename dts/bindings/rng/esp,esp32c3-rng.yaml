%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/esp,esp32c3-rng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-C3 random number generator

maintainers:
  - Eric Migicovsky <eric@repebble.com>

description:
  The RNG_DATA register of the APB controller. Its generator takes entropy
  from the noise of the SAR ADC or the radio while either is on, and is only
  a pseudo-random sequence otherwise.

properties:
  compatible:
    const: esp,esp32c3-rng

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    rng@600260b0 {
        compatible = "esp,esp32c3-rng";
        reg = <0x600260b0 0x4>;
    };
