%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/esp,esp32c3-intmatrix.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-C3 interrupt matrix

maintainers:
  - Eric Migicovsky <eric@repebble.com>

description:
  Routes each of the 62 peripheral interrupt sources of the ESP32-C3 to one
  of the 31 interrupt lines of its CPU. The specifier is the source number.

properties:
  compatible:
    const: esp,esp32c3-intmatrix

  reg:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1

required:
  - compatible
  - reg
  - interrupt-controller
  - "#interrupt-cells"

additionalProperties: false

examples:
  - |
    interrupt-controller@600c2000 {
        compatible = "esp,esp32c3-intmatrix";
        reg = <0x600c2000 0x800>;
        interrupt-controller;
        #interrupt-cells = <1>;
    };
