%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/esp,esp32c3-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-C3 UART controller

maintainers:
  - Eric Migicovsky <eric@repebble.com>

allOf:
  - $ref: /schemas/serial/serial.yaml#

properties:
  compatible:
    const: esp,esp32c3-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description: Function clock, the APB clock.

  current-speed:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Initial baud rate, in bits per second.

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    serial@60000000 {
        compatible = "esp,esp32c3-uart";
        reg = <0x60000000 0x1000>;
        interrupts = <21>;
        clocks = <&clk_apb>;
    };
