# Firmware settings for the xteink_x4_pro board: xteinkx4pro with touch and an e-paper panel.

CONFIG_PLATFORM_XTEINKX4PRO=y
CONFIG_TOUCH=y
CONFIG_SERVICE_BOOT_SPLASH_POWER_OFF=y

CONFIG_ACCEL_SIM=y
CONFIG_ALS_SIM=y
CONFIG_AUDIO_SIM_MIC=y
CONFIG_TEMP_SIM=y
CONFIG_VIBE_SIM=y

CONFIG_OTP_MCU=y
CONFIG_WATCHDOG=y

CONFIG_BT_VENDOR_NAME="Xteink"
CONFIG_PLATFORM_ANIMATION_INSTANT=y
CONFIG_WATCHFACE_BEZEL=y

# Panel at native 480x800 via 2x framebuffer scaling
CONFIG_FRAMEBUFFER_SCALE2=y
CONFIG_DISPLAY_SSD1677_DETAIL_CELLS=10400
CONFIG_DISPLAY_SSD1677_FRAME_COPY=n
