# Firmware settings for the xteink_x4 board: Folio, with simulated sensors until it has drivers.

CONFIG_PLATFORM_FOLIO=y

CONFIG_ACCEL_SIM=y
CONFIG_ALS_SIM=y
CONFIG_AUDIO_SIM_MIC=y
CONFIG_BACKLIGHT_POSIX=y
CONFIG_CHARGER_SIM=y
CONFIG_TEMP_SIM=y
CONFIG_VIBE_SIM=y

CONFIG_MCU_QEMU=y
CONFIG_OTP_QEMU=y
CONFIG_RNG_QEMU=y
CONFIG_RTC_RETAINED=y

CONFIG_BT_VENDOR_NAME="Xteink"
CONFIG_PLATFORM_ANIMATION_INSTANT=y

# Watchfaces at their classic 144x168, centred in black
CONFIG_WATCHFACE_BEZEL=y
