# Firmware settings for the xteink_x4 board: xteinkx4, with simulated sensors until it has drivers.

CONFIG_PLATFORM_XTEINKX4=y

CONFIG_ACCEL_SIM=y
CONFIG_ALS_SIM=y
CONFIG_AUDIO_SIM_MIC=y
CONFIG_BACKLIGHT_POSIX=y
CONFIG_TEMP_SIM=y
CONFIG_VIBE_SIM=y

CONFIG_OTP_MCU=y
CONFIG_RTC_RETAINED=y

CONFIG_BT_VENDOR_NAME="Xteink"

# The radio: Espressif's controller, up at every boot. A bring-up that fails or hangs is reset by
# the RTC watchdog and keeps the radio off until btc clear. -DCONFIG_ESP32C3_BT=n leaves it out.
CONFIG_ESP32C3_BT=y
CONFIG_ESP32C3_BT_ARMED_BY_DEFAULT=y
CONFIG_PLATFORM_ANIMATION_INSTANT=y

# Watchfaces at their classic 144x168, centred in black
CONFIG_WATCHFACE_BEZEL=y

# The timer group watchdog resets the chip when the task watchdog stops feeding it, or a fault
# would spin
CONFIG_WATCHDOG=y
