# Firmware settings for the qemu_esp32c3 board: Flint, with simulated sensors.

CONFIG_PLATFORM_FLINT=y

CONFIG_ACCEL_SIM=y
CONFIG_ALS_SIM=y
CONFIG_AUDIO_SIM_MIC=y
CONFIG_BACKLIGHT_POSIX=y
CONFIG_CHARGER_SIM=y
CONFIG_TEMP_SIM=y
CONFIG_VIBE_SIM=y

CONFIG_OTP_QEMU=y
CONFIG_RTC_RETAINED=y

CONFIG_BT_VENDOR_NAME="QEMU"
