# Firmware settings for the qemu_esp32c3 board: xteinkx4, with simulated sensors.

# Flint instead (144x168 x3, as the X4 until it moves to xteinkx4): set
# CONFIG_PLATFORM_FLINT=y here and the Flint size in qemu_esp32c3.overlay.
CONFIG_PLATFORM_XTEINKX4=y

CONFIG_ACCEL_SIM=y
CONFIG_ALS_SIM=y
CONFIG_AUDIO_SIM_MIC=y
CONFIG_BACKLIGHT_POSIX=y
CONFIG_CHARGER_SIM=y
CONFIG_TEMP_SIM=y
CONFIG_VIBE_SIM=y

CONFIG_OTP_MCU=y
CONFIG_RTC_RETAINED=y

CONFIG_BT_VENDOR_NAME="QEMU"

# Watchfaces at their classic 144x168, centred in black
CONFIG_WATCHFACE_BEZEL=y

# Battery voltage, percent and USB once a minute, kept across reboots: `battery log`
CONFIG_SERVICE_BATTERY_LOG=y
