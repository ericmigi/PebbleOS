# Firmware settings for the qemu_esp32s3 board: xteinkx4pro, with simulated sensors.

CONFIG_PLATFORM_XTEINKX4PRO=y

CONFIG_ACCEL_SIM=y
CONFIG_ALS_SIM=y
CONFIG_AUDIO_SIM_MIC=y
CONFIG_BACKLIGHT_POSIX=y
CONFIG_CHARGER_SIM=y
CONFIG_TEMP_SIM=y
CONFIG_VIBE_SIM=y

CONFIG_OTP_MCU=y
CONFIG_RTC_RETAINED=y

CONFIG_BT_VENDOR_NAME="QEMU"

# Watchfaces at their classic 144x168, centred in black
CONFIG_WATCHFACE_BEZEL=y
