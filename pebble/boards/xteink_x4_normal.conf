# Firmware settings for the xteink_x4 board, normal variant: third-party
# apps are ARM code, which Samsa interprets, with what it keeps per process
# sized for this chip's RAM. The app's scratch and arena are half of
# qemu_esp32c3's (the largest use measured there was 920 B and 1,312 B), for
# the kernel heap: the display shadow already takes 12 KB more than there.

CONFIG_SAMSA=y
CONFIG_SAMSA_APP_SCRATCH_SIZE=8192
CONFIG_SAMSA_APP_ARENA_SIZE=8192
CONFIG_SAMSA_WORKER_SCRATCH_SIZE=4096
CONFIG_SAMSA_WORKER_ARENA_SIZE=4096
CONFIG_SAMSA_MAX_HANDLES=512
CONFIG_SAMSA_MAX_OBJS=256
# Decoded instructions kept per process: 1.47x faster with -O2 on QEMU
CONFIG_SAMSA_CACHE_ENTRIES=256
