# Firmware settings for the xteink_x4 board, normal variant: third-party apps
# are the X4's own RISC-V code (CONFIG_APP_NATIVE_RISCV32, the folio default).
# Samsa, which interprets ARM apps, is left out for its RAM: about 69 KB of
# kernel heap and 188 KB of flash. An app whose pbw has no folio binary is
# refused at launch.
