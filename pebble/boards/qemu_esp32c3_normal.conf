# Firmware settings for the qemu_esp32c3 board, normal variant: third-party
# apps are ARM code, which Samsa interprets, with what it keeps per process
# sized for this chip's RAM.

CONFIG_SAMSA=y
CONFIG_SAMSA_APP_SCRATCH_SIZE=16384
CONFIG_SAMSA_APP_ARENA_SIZE=16384
CONFIG_SAMSA_WORKER_SCRATCH_SIZE=4096
CONFIG_SAMSA_WORKER_ARENA_SIZE=4096
CONFIG_SAMSA_MAX_HANDLES=512
CONFIG_SAMSA_MAX_OBJS=256
