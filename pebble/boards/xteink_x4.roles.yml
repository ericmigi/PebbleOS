# What the firmware needs and the board has no driver for yet: simulated, or a no-op backlight
backlight:
  symbol: POSIX_BACKLIGHT
  include: pbl/drivers/backlight/posix.h
accel:
  symbol: SIM_ACCEL
  include: pbl/drivers/imu/sim.h
als:
  symbol: SIM_ALS
  include: pbl/drivers/als/sim.h
vibe:
  symbol: SIM_VIBE
  include: pbl/drivers/vibe/sim.h
mic:
  symbol: SIM_MIC
  include: pbl/drivers/audio/sim.h
die_temp:
  symbol: SIM_TEMP
  include: pbl/drivers/temp/sim.h
rtc:
  symbol: RETAINED_RTC
  include: pbl/drivers/rtc/retained.h
