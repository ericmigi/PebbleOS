name: Build Samples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, '*-branch']
  workflow_call:

jobs:
  changes-samples:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      should-build: ${{ github.event_name == 'push' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - '.github/actions/**'
              - '.github/workflows/build-samples.yml'
              - 'boards/**'
              - 'cmake/**'
              - 'drivers/**'
              - 'include/**'
              - 'kernel/**'
              - 'lib/**'
              - 'rust/**'
              - 'samples/**'
              - 'soc/**'
              - 'subsys/**'
              - 'third_party/**'
              - 'tools/**'
              - 'Kconfig*'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'SDK_VERSION'
              - 'pbl.yml'
              - 'requirements.txt'
              - 'rust-toolchain.toml'

  # The boards the samples name for integration, from their sample.yml.
  samples-boards:
    needs: changes-samples
    if: needs.changes-samples.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v17

    outputs:
      boards: ${{ steps.boards.outputs.boards }}

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: List the boards
        id: boards
        run: echo "boards=$(pbl samples --integration --list-boards)" >> "$GITHUB_OUTPUT"

  # The samples only need PebbleOS: building them keeps it from depending on
  # the firmware again.
  build-samples:
    needs: samples-boards
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v17

    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.samples-boards.outputs.boards) }}

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      # Espressif's toolchain and QEMU, at the versions ESP-IDF 5.5.5 pins
      - name: Install the Espressif toolchain and QEMU
        if: startsWith(matrix.board, 'qemu_esp32')
        env:
          ESP_ARCH: ${{ matrix.board == 'qemu_esp32s3' && 'xtensa' || 'riscv32' }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl xz-utils \
            libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          mkdir -p /opt/espressif
          cd /opt/espressif
          fetch() {
            curl -fsSL -o pkg.tar.xz "$1"
            echo "$2  pkg.tar.xz" | sha256sum -c -
            tar xf pkg.tar.xz
            rm pkg.tar.xz
          }
          if [ "$ESP_ARCH" = xtensa ]; then
            gcc_sha=da31f36d79d4e99f24e55a90a71e65d5694714f16199960bf7885724b706a48c
            qemu_sha=0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
          else
            gcc_sha=b3fce4b04dd15a9f0ed1c209b5a2f389c04eff92ed85e4cc0ebc275b7d95e95a
            qemu_sha=547f03e04701a92cbb699f7f7d015adc1f5b5ef93cbb94c0dd9b7107e2d84e77
          fi
          fetch "https://github.com/espressif/crosstool-NG/releases/download/esp-14.2.0_20260121/${ESP_ARCH}-esp-elf-14.2.0_20260121-x86_64-linux-gnu.tar.xz" "$gcc_sha"
          fetch "https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-${ESP_ARCH}-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz" "$qemu_sha"
          echo "/opt/espressif/${ESP_ARCH}-esp-elf/bin" >> "$GITHUB_PATH"
          echo /opt/espressif/qemu/bin >> "$GITHUB_PATH"

      # Runs them too, and checks what they print, on the emulator.
      - name: Build and run
        run: pbl samples --integration --board ${{ matrix.board }}

  build-samples-status:
    needs: [changes-samples, samples-boards, build-samples]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          needs.samples-boards.result == 'failure' ||
          needs.samples-boards.result == 'cancelled' ||
          needs.build-samples.result == 'failure' ||
          needs.build-samples.result == 'cancelled'
        run: exit 1
